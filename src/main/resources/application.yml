server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: smart-krishi-sahayak

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:krishi_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DATABASE_USERNAME:root}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:root}}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

  jpa:
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        connection:
          characterEncoding: UTF-8
          useUnicode: true
          charSet: UTF-8

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Application Custom Properties
app:
  name: Smart Krishi Sahayak
  version: 1.0.0-SNAPSHOT
  environment: ${SPRING_PROFILES_ACTIVE:dev}
  supported-languages:
    - EN
    - MR
    - HI
  admin:
    mobile: ${APP_ADMIN_MOBILE:${ADMIN_MOBILE:9999999999}}
    email: ${APP_ADMIN_EMAIL:${ADMIN_EMAIL:admin@smartkrishi.gov.in}}
    password: ${APP_ADMIN_PASSWORD:${ADMIN_PASSWORD:Admin@SecurePass2026}}
  jwt:
    secret: ${JWT_SECRET:c7b5a8e2d4f10938b65e21a4f0739c68c7b5a8e2d4f10938b65e21a4f0739c68}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      timeout-ms: ${GEMINI_TIMEOUT_MS:30000}
  weather:
    provider: ${WEATHER_PROVIDER:open-meteo}
    api-key: ${WEATHER_API_KEY:}
    base-url: ${WEATHER_BASE_URL:https://api.open-meteo.com/v1}
    timeout-ms: ${WEATHER_TIMEOUT_MS:5000}
    cache-ttl-minutes: ${WEATHER_CACHE_TTL_MINUTES:15}

