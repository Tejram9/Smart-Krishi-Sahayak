<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Farming Assistant - Smart Krishi Sahayak</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="d-flex flex-column vh-100 overflow-hidden">

  <!-- Main Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom flex-shrink-0" aria-label="Main Navigation">
    <div class="container-fluid">
      <a class="navbar-brand-text" href="/farmer-dashboard.html">
        <span class="brand-icon"><i class="bi bi-tree-fill"></i></span>
        <span data-i18n="app_name">Smart Krishi Sahayak</span>
      </a>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="/farmer-dashboard.html" class="btn btn-outline-success btn-sm d-none d-md-inline-flex align-items-center gap-1">
          <i class="bi bi-grid-fill"></i> <span data-i18n="nav_dashboard">Dashboard</span>
        </a>
        <select class="lang-select" aria-label="Select Language">
          <option value="EN">English (EN)</option>
          <option value="MR">मराठी (MR)</option>
          <option value="HI">हिंदी (HI)</option>
        </select>
        <button id="logoutBtn" class="btn-logout btn-sm" aria-label="Logout">
          <i class="bi bi-box-arrow-right"></i> <span class="d-none d-sm-inline" data-i18n="nav_logout">Logout</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Mobile Backdrop Overlay -->
  <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

  <!-- Chat App Container -->
  <div class="chat-app-wrapper flex-grow-1">

    <!-- Left Sidebar: Chat History -->
    <aside id="chatSidebar" class="chat-sidebar" aria-label="Chat History Sidebar">
      <div class="chat-sidebar-header">
        <button id="newChatBtn" class="btn-new-chat" type="button" aria-label="Create New Chat">
          <i class="bi bi-plus-lg"></i>
          <span data-i18n="chat_new_chat">New Chat</span>
        </button>
      </div>

      <div class="d-flex justify-content-between align-items-center px-3 pt-3 pb-1">
        <span class="text-muted fw-bold text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;" data-i18n="chat_history_title">Chat History</span>
        <span id="sessionCountBadge" class="badge bg-secondary rounded-pill" style="font-size: 0.7rem;">0</span>
      </div>

      <div id="sessionsList" class="sessions-list-container" role="list">
        <!-- Sessions rendered dynamically -->
        <div id="sessionsLoading" class="text-center py-4 text-muted">
          <div class="spinner-border spinner-border-sm text-success" role="status"></div>
          <p class="mt-2 mb-0" style="font-size: 0.8rem;" data-i18n="common_loading">Loading...</p>
        </div>
      </div>
    </aside>

    <!-- Main Chat Pane -->
    <main class="chat-main" role="main">
      <!-- Main Chat Header -->
      <header class="chat-main-header">
        <div class="chat-header-title-box">
          <button id="sidebarToggleBtn" class="btn-sidebar-toggle" type="button" aria-label="Toggle Chat History">
            <i class="bi bi-layout-sidebar"></i>
          </button>
          <div>
            <h1 class="chat-header-title" id="currentSessionTitle" data-i18n="chat_page_title">AI Farming Assistant</h1>
            <p class="chat-header-subtitle" data-i18n="chat_page_subtitle">Ask any agricultural question in Marathi, Hindi, or English</p>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2">
          <span id="activeLangBadge" class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 fw-bold">EN</span>
        </div>
      </header>

      <!-- Message History Container -->
      <div id="messagesContainer" class="chat-messages-container" role="log" aria-live="polite">
        <!-- Welcome Card or Messages rendered dynamically -->
      </div>

      <!-- Bottom Chat Input -->
      <footer class="chat-input-wrapper">
        <form id="chatForm" class="d-flex flex-column gap-2" onsubmit="return false;">
          <div class="chat-input-row">
            <textarea
              id="messageInput"
              class="chat-textarea"
              rows="1"
              maxlength="2000"
              placeholder="Type your farming question here... (Press Enter to send, Shift+Enter for newline)"
              data-i18n-placeholder="chat_input_placeholder"
              aria-label="Farming query message input"></textarea>
            <button id="sendBtn" class="btn-chat-send" type="button" aria-label="Send Message" title="Send (Enter)">
              <i class="bi bi-send-fill"></i>
            </button>
          </div>

          <div class="chat-input-footer">
            <p class="chat-disclaimer" data-i18n="chat_disclaimer">
              Smart Krishi Sahayak provides science-backed information support. For critical chemical treatments, consult your local Krishi Seva Kendra.
            </p>
            <span id="charCounter" class="text-muted" style="font-size: 0.72rem;">0 / 2000</span>
          </div>
        </form>
      </footer>
    </main>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/chatbot.js"></script>
</body>
</html>
