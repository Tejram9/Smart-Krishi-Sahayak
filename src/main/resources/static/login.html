<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Krishi Sahayak</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand-text" href="/index.html">
        <span class="brand-icon"><i class="bi bi-tree-fill"></i></span>
        <span data-i18n="app_name">Smart Krishi Sahayak</span>
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <select class="lang-select" aria-label="Select Language">
          <option value="EN">English (EN)</option>
          <option value="MR">मराठी (MR)</option>
          <option value="HI">हिंदी (HI)</option>
        </select>
        <a href="/register.html" class="btn btn-sm btn-outline-success" data-i18n="nav_register">Register</a>
      </div>
    </div>
  </nav>

  <!-- Login Main Container -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand-logo"><i class="bi bi-person-lock"></i></div>
        <h1 class="auth-title" data-i18n="login_title">Welcome Back</h1>
        <p class="auth-subtitle" data-i18n="login_subtitle">Log in to access your farmer dashboard and AI assistant.</p>
      </div>

      <!-- Alert Banner -->
      <div id="alertBanner" class="alert-banner alert-banner-danger" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="mb-3">
          <label for="mobileNumberOrEmail" class="form-label" data-i18n="login_mobile_or_email">Mobile Number or Email</label>
          <input type="text" class="form-control" id="mobileNumberOrEmail" data-i18n-placeholder="login_mobile_placeholder" placeholder="Enter 10-digit mobile number or email" required autocomplete="username">
        </div>

        <div class="mb-4">
          <label for="password" class="form-label" data-i18n="login_password">Password</label>
          <input type="password" class="form-control" id="password" data-i18n-placeholder="login_password_placeholder" placeholder="Enter password" required autocomplete="current-password">
        </div>

        <button type="submit" id="submitBtn" class="btn-auth-submit">
          <span data-i18n="login_btn">Log In</span> <i class="bi bi-arrow-right-short fs-5"></i>
        </button>
      </form>

      <div class="auth-footer-link">
        <span data-i18n="login_no_account">Don't have an account?</span>
        <a href="/register.html" data-i18n="login_register_link">Register here</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p data-i18n="footer_text">© 2026 Smart Krishi Sahayak. Dedicated to Indian Agriculture & Farmer Prosperity.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
